name: CI

permissions:
  contents: read

on:
  push:
    # Run on push to any branch
    branches: ['**']
  pull_request:
    # Run on pull request to any branch
    branches: ['**']

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # - name: Add Kitware APT repo and GPG key
      #   run: |
      #     mkdir -p /etc/apt/keyrings

      #     wget -qO - https://apt.kitware.com/keys/kitware-archive-latest.asc | \
      #       gpg --dearmor -o /etc/apt/keyrings/kitware.gpg

      #     echo "deb [signed-by=/etc/apt/keyrings/kitware.gpg] https://apt.kitware.com/ubuntu/ focal main" > /etc/apt/sources.list.d/kitware.list

      #     apt-get update

      - name: Install dependencies (if needed)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake wget ca-certificates
          sudo apt-get install -y qtbase5-dev qtchooser qt5-qmake qtbase5-dev-tools
          sudo apt-get install -y libgsl-dev libssl-dev
          export GSL_DIR=/usr
          sudo apt-get install -y libfftw3-dev
          export FFTW_DIR=/usr
          sudo apt-get install -y libx11-dev libxpm-dev libxft-dev libxext-dev
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev

          echo "GSL_DIR=$GSL_DIR" >> $GITHUB_ENV
          echo "FFTW_DIR=$FFTW_DIR" >> $GITHUB_ENV


          wget https://root.cern/download/root_v6.26.14.Linux-ubuntu22-x86_64-gcc11.4.tar.gz
          tar xvf root_v6.26.14.Linux-ubuntu22-x86_64-gcc11.4.tar.gz
          export ROOTSYS=$PWD/root/
          export ROOT_DIR=$PWD/root/

          echo "ROOTSYS=$ROOTSYS" >> $GITHUB_ENV
          echo "ROOT_DIR=$ROOT_DIR" >> $GITHUB_ENV
          
          wget https://geant4.web.cern.ch/sites/default/files/geant4/geant4.11.4.2.tar.gz
          tar xzf geant4.11.4.2.tar.gz
          export GEANT4_SRC=$(find "$PWD" -maxdepth 1 -mindepth 1 -type d -name 'geant4*11.4.2*' | head -n1)
          test -n "$GEANT4_SRC"
          cmake -S "$GEANT4_SRC" -B geant4.11.4.2-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/geant4-v11.4.2" \
            -DGEANT4_INSTALL_DATA=ON \
            -DGEANT4_INSTALL_EXAMPLES=OFF \
            -DGEANT4_USE_QT=ON \
            -DGEANT4_USE_OPENGL_X11=ON
          cmake --build geant4.11.4.2-build --config Release --target install -- -j"$(nproc)"
          export GEANT4_DIR=$HOME/geant4-v11.4.2
          if [ -d "$GEANT4_DIR/lib64" ] && [ ! -e "$GEANT4_DIR/lib" ]; then ln -s lib64 "$GEANT4_DIR/lib"; fi
          if [ -d "$GEANT4_DIR/lib" ] && [ ! -e "$GEANT4_DIR/lib64" ]; then ln -s lib "$GEANT4_DIR/lib64"; fi
          echo "GEANT4_DIR=$GEANT4_DIR" >> $GITHUB_ENV
          echo "Geant4_DIR=$GEANT4_DIR/lib/cmake/Geant4" >> $GITHUB_ENV


      - name: Build project
        run: |
          export LD_LIBRARY_PATH=$HOME/geant4-v11.4.2/lib:$HOME/geant4-v11.4.2/lib64:$PWD/root/lib:/usr/lib/x86_64-linux-gnu/:$LD_LIBRARY_PATH
          mkdir -p build
          cd build
          cmake ..
          cmake --build . --config Release --target install
          export GEANT4_DATA_DIR=$(find "$HOME/geant4-v11.4.2/share" -maxdepth 2 -type d -name data | head -n1)
          test -n "$GEANT4_DATA_DIR"
          printf '%s\n' "$GEANT4_DATA_DIR" > .data

      - name: Run tests
        run: |
          cd build
          pwd; ls
          #ctest --output-on-failure
          # or replace with ./run_tests.sh or pytest

  docker-image:
    # Runs on the host runner (not in a container) so that Docker is available.
    runs-on: ubuntu-22.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push) image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Pull requests from forks cannot push to GHCR; build only.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        if: github.event_name != 'pull_request'
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run --rm "$IMAGE" sh -c 'command -v g4bl && g4bl --version'
