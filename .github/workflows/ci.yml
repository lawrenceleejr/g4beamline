name: CI

on:
  push:
    # Run on push to any branch
    branches: ['**']
  pull_request:
    # Run on pull request to any branch
    branches: ['**']

# A newer push to the same ref supersedes a run in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    container:
      image: artemisbeta/geant4:11.4.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # - name: Add Kitware APT repo and GPG key
      #   run: |
      #     mkdir -p /etc/apt/keyrings

      #     wget -qO - https://apt.kitware.com/keys/kitware-archive-latest.asc | \
      #       gpg --dearmor -o /etc/apt/keyrings/kitware.gpg

      #     echo "deb [signed-by=/etc/apt/keyrings/kitware.gpg] https://apt.kitware.com/ubuntu/ focal main" > /etc/apt/sources.list.d/kitware.list

      #     apt-get update

      - name: Install dependencies (if needed)
        run: |
          #conda install -y cmake make gxx # Add other dependencies here
          #conda clean -a
          apt-get update
          # Geant4 11.4 is built against Qt6, so G4beamline must use Qt6 too
          apt-get install -y qt6-base-dev qt6-base-dev-tools
          apt-get install -y libgsl-dev libssl-dev
          export GSL_DIR=/usr
          # libvdt-dev: ROOT's ROOTConfig.cmake requires the system vdt
          apt-get install -y libfftw3-dev libtbb12 libxml2 libvdt-dev
          export FFTW_DIR=/usr

          echo "GSL_DIR=$GSL_DIR" >> $GITHUB_ENV
          echo "FFTW_DIR=$FFTW_DIR" >> $GITHUB_ENV


          # The Geant4 11.4 base image is Ubuntu 25.04 / gcc 14; ROOT has no
          # 25.04 binary release, and its 24.04/gcc13.3 build is ABI compatible.
          wget -q https://root.cern/download/root_v6.40.04.Linux-ubuntu24.04-x86_64-gcc13.3.tar.gz
          tar xzf root_v6.40.04.Linux-ubuntu24.04-x86_64-gcc13.3.tar.gz
          export ROOTSYS=$PWD/root/
          export ROOT_DIR=$PWD/root/

          echo "ROOTSYS=$ROOTSYS" >> $GITHUB_ENV
          echo "ROOT_DIR=$ROOT_DIR" >> $GITHUB_ENV
          
          # Locate Geant4 in the base image rather than hard-coding its version
          export Geant4_DIR=$(dirname $(find /usr/local/share/geant4 -name Geant4Config.cmake | head -n1))
          echo "Geant4_DIR=$Geant4_DIR" >> $GITHUB_ENV


      - name: Build project
        run: |
          export LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu/:$ROOTSYS/lib:$LD_LIBRARY_PATH
          mkdir -p build
          cd build
          cmake ..
          cmake --build . --config Release --target install

      - name: Run tests
        run: |
          cd build
          pwd; ls
          #ctest --output-on-failure
          # or replace with ./run_tests.sh or pytest

  docker-image:
    # Runs on the host runner (not in a container) so that Docker is available.
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push) image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Pull requests from forks cannot push to GHCR; build only.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        if: github.event_name != 'pull_request'
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          # g4bl has no --version flag; run a real example instead.
          docker run --rm "$IMAGE" g4bl /usr/src/g4beamline/examples/Example1.g4bl
